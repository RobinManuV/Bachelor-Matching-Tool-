[build]
  command = "npm run deploy:setup"
  publish = "robin-airlines-selector"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["src/questionnaire-data.cjs", "lib/careers-data.json"]

[[redirects]]
  from = "/api/match"
  to = "/.netlify/functions/match"
  status = 200
  force = true

[[redirects]]
  from = "/api/school/apply"
  to = "/.netlify/functions/school-apply"
  status = 200
  force = true

[[redirects]]
  from = "/api/feedback"
  to = "/.netlify/functions/feedback"
  status = 200
  force = true

[[redirects]]
  from = "/api/internal/recommender-sessions"
  to = "/.netlify/functions/recommender-sessions"
  status = 200
  force = true
