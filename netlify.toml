[build]
  command = "npm run deploy:setup"
  publish = "robin-airlines-selector"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["src/questionnaire-data.mjs", "lib/careers-data.json"]

[[redirects]]
  from = "/api/match"
  to = "/.netlify/functions/match"
  status = 200
  force = true

[[redirects]]
  from = "/api/school/apply"
  to = "/.netlify/functions/school-apply"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/*"
  to = "/.netlify/functions/admin?route=:splat"
  status = 200
  force = true
